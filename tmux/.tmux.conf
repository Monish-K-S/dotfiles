# ─────────────────────────────
# Status bar
# ─────────────────────────────

set -g status on
set -g status-position top
set -g status-interval 5
set -g status-left-length 30

# Left: session name
set -g status-left "  #S  "

# Window names
set -g window-status-format "  #I:#W  "
set -g window-status-current-format "  #I:#W  "
set -g automatic-rename on
set -g automatic-rename-format "#{pane_current_command}"
# Right: time
set -g status-right " %H:%M  "
# Resize panes with Option + Shift + Arrow
bind -n M-S-Left  resize-pane -L 3
bind -n M-S-Right resize-pane -R 3
bind -n M-S-Up    resize-pane -U 3
bind -n M-S-Down  resize-pane -D 3
# ─────────────────────────────
# Orange theme
# ─────────────────────────────

# Main status bar
set -g status-style "bg=colour234,fg=colour245"

# Inactive windows
set -g window-status-style "fg=colour245,bg=colour234"

# Active window — orange
set -g window-status-current-style "fg=colour208,bold,bg=colour235"

# Session name — orange
set -g status-left-style "fg=colour208,bold"

# Clock
set -g status-right-style "fg=colour245"


# ─────────────────────────────
# Pane borders
# ─────────────────────────────

# Inactive pane
set -g pane-border-style "fg=colour238"

# Active pane — orange
set -g pane-active-border-style "fg=colour208"
# mouse pane scroll
set -g mouse on

set -g @plugin 'tmux-plugins/tmux-yank'
# ─────────────────────────────
# Your existing shortcuts
# ─────────────────────────────
set -s set-clipboard on
unbind C-b
set -g prefix C-a
bind C-a send-prefix

bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D


# ─────────────────────────────
# Plugins
# ─────────────────────────────

# Persistence
set -g @plugin 'tmux-plugins/tmux-resurrect'

# TPM - keep this at the bottom
run '~/.tmux/plugins/tpm/tpm'
